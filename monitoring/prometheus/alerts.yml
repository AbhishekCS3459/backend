groups:
  - name: find-me-api
    rules:
      - alert: ApiDown
        expr: up{job="find-me-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Find Me API is not responding to scrapes"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="find-me-api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="find-me-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of API requests are failing with 5xx"

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="find-me-api"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile API latency is above 1s"
